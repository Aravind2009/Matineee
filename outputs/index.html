g-item{border:1px solid transparent;background:transparent;border-radius:14px;text-align:left;padding:12px;display:flex;align-items:center;gap:11px;color:var(--ink)}.outing-item.active{background:#edf3fc;border-color:#d5e1f4}.poster{width:45px;height:54px;border-radius:9px;display:grid;place-items:center;font-size:22px;flex:none}.outing-name{font-weight:700;font-size:14px}.outing-meta{display:block;font-size:12px;color:var(--muted);margin-top:4px}.add-outing{width:100%;margin-top:12px}.main{min-width:0}.room-head{padding:23px 25px;display:block}.room-head .actions{justify-content:flex-start;max-width:none;margin-top:16px}.film-title{font:800 25px Manrope;letter-spacing:-.8px;margin:5px 0}.film-meta{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 16px}.stat{padding:16px 18px}.stat-label{font-size:12px;color:var(--muted)}.stat-value{font:800 23px Manrope;margin-top:5px}.stat-foot{font-size:11px;color:var(--muted);margin-top:3px}.content-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(250px,.85fr);gap:16px}.card{padding:19px}.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.card-title{font:700 16px Manrope}.person{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.person:last-child{border:0}.person-name{font-weight:700}.person-detail{font-size:12px;color:var(--muted);margin-top:3px}.amount{text-align:right;font-weight:700}.amount small{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:4px}.status{font-size:11px;border-radius:30px;padding:4px 8px;display:inline-block;font-weight:700;margin-top:5px}.status.paid{background:#e7effb;color:#315ea8}.status.partial{background:#fff2d6;color:#8d5b00}.status.unpaid{background:#fce9e6;color:#963e35}.toolbar{display:flex;gap:7px;align-items:center}.icon-btn{border:0;background:#f2f5f1;border-radius:9px;width:32px;height:32px;color:var(--green)}.booker-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}.booker-row:last-child{border:0}.booker-name{font-weight:700}.booker-detail{font-size:12px;color:var(--muted);margin-top:3px}.ledger{margin-top:16px}.ledger-item{padding:11px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;font-size:13px}.ledger-item:last-child{border:0}.ledger-actions{display:flex;gap:6px;align-items:center}.hint{background:#f1f5fc;border-radius:12px;padding:12px;color:#465b7d;font-size:12px;line-height:1.5;margin-top:12px}.room-code{padding:13px;border:1px dashed #b9c9e3;background:#f7f9fd;border-radius:12px;font-size:12px;line-height:1.5;margin-top:12px}.room-code b{font:700 17px Manrope;letter-spacing:.08em}.notes{font-size:13px;color:var(--muted);line-height:1.55;margin-top:13px}.empty{padding:50px 20px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);font:700 17px Manrope;margin-bottom:6px}.notice{background:#fff8e9;border:1px solid #f0dfb4;padding:12px 14px;border-radius:12px;font-size:12px;line-height:1.5;margin-top:16px}.inactive{opacity:.55}.archived-label{font-size:10px;color:var(--orange);font-weight:700;text-transform:uppercase;letter-spacing:.08em}.modal-back{position:fixed;inset:0;background:#0c2019a6;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-back.open{display:flex}.modal{background:#fff;border-radius:20px;padding:24px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:0 24px 90px #0003}.modal h2{font:800 21px Manrope;margin:0 0 17px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;font-weight:700;color:#46584f}.field input,.field textarea,.field select{width:100%;border:1px solid #dce5dd;background:#fbfcfa;border-radius:10px;padding:11px 12px;color:var(--ink);outline:none}.field input:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px #315ea818}.field textarea{min-height:70px;resize:vertical}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.radio-hint{color:var(--muted);font-size:11px;line-height:1.45}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#15392b;color:white;padding:11px 16px;border-radius:30px;font-size:13px;display:none;z-index:30;box-shadow:var(--shadow)}

body[data-theme="dark"]{--ink:#ededed;--muted:#b0b0b0;--paper:#121212;--white:#1f1f1f;--green:#8ab4f8;--mint:#293548;--lime:#d8ef86;--line:#383838;--orange:#efab78;--rose:#f29a91;--shadow:0 12px 40px #0006;color-scheme:dark}body[data-theme="dark"] .panel,body[data-theme="dark"] .modal{background:#1f1f1f;border-color:#383838}body[data-theme="dark"] .local-pill,body[data-theme="dark"] .ghost{background:#292929;color:var(--ink);border-color:#454545}body[data-theme="dark"] .outing-item.active{background:#2a2a2a;border-color:#505050}body[data-theme="dark"] .icon-btn{background:#303030;color:#a8c7fa}body[data-theme="dark"] .hint{background:#292929;color:#d0d0d0}body[data-theme="dark"] .room-code{background:#242424;border-color:#505050}body[data-theme="dark"] .notice{background:#302b20;border-color:#5d5138;color:#eadfca}body[data-theme="dark"] .field input,body[data-theme="dark"] .field textarea,body[data-theme="dark"] .field select{background:#171717;border-color:#484848;color:#ededed}body[data-theme="dark"] .field label{color:#d0d0d0}body[data-theme="dark"] .status.paid{background:#243247;color:#b5cdf7}body[data-theme="dark"] .status.partial{background:#4b3c20;color:#f4d48b}body[data-theme="dark"] .status.unpaid{background:#4b2825;color:#f2aaa0}body[data-theme="dark"] .primary{background:#315ea8;color:#fff}

<body><div class="shell"><header class="topbar"><div class="brand"><span class="brand-mark">▶</span> matinee</div><div class="top-right"><span>Movie night, sorted.</span><button class="local-pill" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle dark mode">☾ Dark mode</button><span class="local-pill" id="syncStatus">● Saved on this device</span></div></header><div class="hero"><div><div class="eyebrow">Your movie rooms</div><h1>Good plans, clear tabs.</h1><p>Keep the tickets and the little details together.</p></div><button class="button primary" onclick="newOuting()">＋ New outing</button></div><div class="layout"><aside class="panel sidebar"><div class="section-head"><span>Your outings</span><span class="count" id="outingCount"></span></div><div class="outing-list" id="outingList"></div><button class="button ghost add-outing" onclick="newOuting()">＋ Create a movie room</button><button class="button secondary add-outing" onclick="joinRoom()">Join with a room code</button><div class="notice">🔐 <b>Shared rooms:</b> no Gmail or phone sign-up. Anyone with a room invite can view and edit it. Share codes only with people you trust.</div></aside><main class="main" id="main"></main></div></div><div class="modal-back" id="modalBack" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const KEY='matinee.rooms.v1';const THEME_KEY='matinee.theme';const colors=['#f5d9c6','#dde6fa','#e4edbd','#f3d6e7','#d5eee6'];const emojis=['🎬','🍿','🎟️','✨','🌙'];let db=JSON.parse(localStorage.getItem(KEY)||'null')||{active:null,rooms:[]};const demoRooms=new Set(['room-1','room-2','room-3']);const oldRoomCount=db.rooms.length;db.rooms=db.rooms.filter(r=>!demoRooms.has(r.id));if(db.rooms.length!==oldRoomCount){db.active=db.rooms[0]?.id||null;localStorage.setItem(KEY,JSON.stringify(db))}let selected=db.rooms.some(r=>r.id===db.active)?db.active:(db.rooms[0]?.id||null);let applyingRemote=false;const remoteStates=new Map();function persistLocal(){localStorage.setItem(KEY,JSON.stringify(db))}function save(){persistLocal();const r=room();if(!applyingRemote&&r?.shared&&!r.syncConflict)queueRemoteSave(r)}function setSyncBadge(){const el=document.getElementById('syncStatus');if(!el)return;const r=room();el.textContent=r?.shared?(r.syncConflict?'⚠ Sync conflict':'● Shared · sync on'): '● Saved on this device'}
async function callRoomApi(action,payload={}){let response;try{response=await fetch('/api/rooms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...payload})})}catch{throw new Error('Could not reach the shared-room service. Open the live Netlify site and try again.')}let result;try{result=await response.json()}catch{result={}}if(!response.ok){let message=result.error;if(!message&&response.status===404)message='Shared rooms are not set up on this site yet. The Netlify backend and database must be deployed first.';if(!message&&(response.status===502||response.status===503))message='The shared-room service is unavailable. Check that the Netlify database is enabled, then try again.';const e=new Error(message||'Shared-room request failed ('+response.status+').');e.status=response.status;throw e}return result}
function cleanSharedSnapshot(r){const copy=JSON.parse(JSON.stringify(r));delete copy.ownerToken;delete copy.syncVersion;delete copy.syncConflict;return copy}
async function createSharedRoom(r){if(r.shared)return true;if(location.protocol==='file:'||!location.hostname)throw new Error('Open the deployed Netlify site to create a room that syncs between devices.');const result=await callRoomApi('create',{room:cleanSharedSnapshot(r)});Object.assign(r,result.room,{ownerToken:result.ownerToken,shared:true,syncVersion:result.version});persistLocal();startRoomPolling();render();return true}
function queueRemoteSave(r){let state=remoteStates.get(r.id);if(!state){state={timer:null,busy:false,dirty:false};remoteStates.set(r.id,state)}state.dirty=true;clearTimeout(state.timer);state.timer=setTimeout(()=>flushRemoteSave(r.id),600)}
async function flushRemoteSave(roomId){const state=remoteStates.get(roomId),r=db.rooms.find(x=>x.id===roomId);if(!state||!r?.shared||r.syncConflict||state.busy||!state.dirty)return;state.busy=true;state.dirty=false;try{const result=await callRoomApi('update',{code:r.code,version:r.syncVersion,room:cleanSharedSnapshot(r)});r.syncVersion=result.version;persistLocal()}catch(e){if(e.status===409){r.syncConflict=true;persistLocal();render();toast('Someone changed this room on another device. Load the latest copy before continuing.')}else{console.error(e);const badge=document.getElementById('syncStatus');if(badge&&room()?.id===r.id)badge.textContent='⚠ Sync unavailable'}}finally{state.busy=false;if(state.dirty){clearTimeout(state.timer);state.timer=setTimeout(()=>flushRemoteSave(roomId),400)}}}
async function fetchSharedRoom(code){return callRoomApi('get',{code})}
function applySharedRoom(local,result){const ownerToken=local.ownerToken;Object.assign(local,result.room,{ownerToken,shared:true,syncVersion:result.version});delete local.syncConflict;}
async function pollSharedRooms(){if(document.getElementById('modalBack')?.classList.contains('open'))return;for(const local of db.rooms.filter(r=>r.shared&&!r.syncConflict)){const state=remoteStates.get(local.id);if(state?.dirty||state?.busy)continue;try{const result=await fetchSharedRoom(local.code);if(result.version!==local.syncVersion){applyingRemote=true;applySharedRoom(local,result);persistLocal();if(selected===local.id)render();applyingRemote=false}}catch(e){if(e.status===404){console.warn('Shared room invite is no longer valid.')}else console.warn('Shared room refresh failed',e)}}}
let roomPollingTimer=null;function startRoomPolling(){if(roomPollingTimer!==null)return;roomPollingTimer=setInterval(pollSharedRooms,6000)}
async function reloadSharedRoom(){const r=room();if(!r?.shared)return;try{const result=await fetchSharedRoom(r.code);applySharedRoom(r,result);persistLocal();render();toast('Latest shared room loaded')}catch(e){toast(e.message)}}
async function joinSharedCode(code){const clean=String(code||'').trim().toLowerCase();if(!/^[a-f0-9]{32}$/.test(clean))throw new Error('Room codes are 32 characters. Paste the invite code or open the invite link.');const result=await fetchSharedRoom(clean);let local=db.rooms.find(r=>r.code===result.room.code);if(local)applySharedRoom(local,result);else{local={...result.room,shared:true,syncVersion:result.version};db.rooms.unshift(local)}selected=local.id;db.active=selected;persistLocal();closeModal();render();startRoomPolling();toast('Joined shared room')}
function joinRoom(){const body='<div class="field"><label>Room code *</label><input id="joinCode" maxlength="32" autocomplete="off" placeholder="Paste the 32-character invite code"></div><div class="radio-hint">No Gmail or phone sign-up. Anyone with the room code can view and edit the room.</div>';openForm('Join a shared room',body,()=>joinSharedCode(val('joinCode')).catch(e=>toast(e.message)),'Join room')}
function openRoomInviteFromUrl(){const url=new URL(location.href),code=url.searchParams.get('room');if(!code)return;url.searchParams.delete('room');history.replaceState({},'',url);joinSharedCode(code).catch(e=>toast(e.message))}
function normalizeLegacySamples(){let changed=false;for(const r of db.rooms){if(!/^room-[123]$/.test(r.id)||bookedTotal(r)>=10000||Math.max(0,...Object.values(r.allocations||{}))>=1000)continue;for(const b of r.bookers)b.paid*=100;for(const k of Object.keys(r.allocations))r.allocations[k]*=100;for(const t of r.payments)t.amount*=100;changed=true}if(changed)save()}normalizeLegacySamples();function applyTheme(){let dark=localStorage.getItem(THEME_KEY)==='dark';document.body.dataset.theme=dark?'dark':'light';let b=document.getElementById('themeToggle');if(b)b.textContent=dark?'☀ Light mode':'☾ Dark mode'}function toggleTheme(){localStorage.setItem(THEME_KEY,document.body.dataset.theme==='dark'?'light':'dark');applyTheme()}function room(){return db.rooms.find(r=>r.id===selected)}function money(n){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format((n||0)/100)}function id(){return Math.random().toString(36).slice(2,9)}function dateText(d){return d?new Date(d+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',weekday:'short'}):'Date to be decided'}function livePeople(r){return r.people.filter(p=>p.active)}function bookedShare(r,pid){let person=r.people.find(p=>p.id===pid);return person&&r.bookers.some(b=>b.name.toLowerCase()===person.name.toLowerCase()&&b.paid>=owed(r,pid))?owed(r,pid):0}function received(r,pid){return r.payments.filter(x=>x.person===pid&&x.state==='received').reduce((a,x)=>a+x.amount,0)+bookedShare(r,pid)}function sent(r,pid){return r.payments.filter(x=>x.person===pid&&x.state==='sent').reduce((a,x)=>a+x.amount,0)}function owed(r,pid){return Number(r.allocations[pid]||0)}function status(r,p){let paid=received(r,p.id);return paid>=owed(r,p.id)?'Paid':paid?'Partially paid':'Unpaid'}function total(r){return livePeople(r).reduce((a,p)=>a+owed(r,p.id),0)}function bookedTotal(r){return r.bookers.reduce((a,b)=>a+Number(b.paid||0),0)}function splitCents(r,count=livePeople(r).length){return count?Math.floor(bookedTotal(r)/count):0}function recalculate(r){let ps=livePeople(r),c=bookedTotal(r),base=ps.length?Math.floor(c/ps.length):0,extra=ps.length?c%ps.length:0;ps.forEach((p,i)=>r.allocations[p.id]=base+(i<extra?1:0))}function bookerShares(r){let w=r.bookers.map(b=>Math.max(0,b.paid)),sum=w.reduce((a,x)=>a+x,0);return r.bookers.map((b,i)=>({b,weight:sum?w[i]/sum:(r.bookers.length?1/r.bookers.length:0)}))}function collectable(r,bid){let share=bookerShares(r).find(x=>x.b.id===bid)?.weight||0,name=r.bookers.find(b=>b.id===bid)?.name.toLowerCase();return livePeople(r).filter(p=>p.name.toLowerCase()!==name).reduce((a,p)=>a+Math.max(0,owed(r,p.id)-received(r,p.id))*share,0)}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){setSyncBadge();let list=document.getElementById('outingList');document.getElementById('outingCount').textContent=db.rooms.length+' rooms';list.innerHTML=db.rooms.map((r,i)=>`<button class="outing-item ${r.id===selected?'active':''}" onclick="selectRoom('${r.id}')"><span class="poster" style="background:${colors[i%colors.length]}">${emojis[i%emojis.length]}</span><span><span class="outing-name">${esc(r.movie)}</span><span class="outing-meta">${dateText(r.date)} · ${livePeople(r).length} going</span></span></button>`).join('');if(!room()){document.getElementById('main').innerHTML='<div class="panel empty"><b>Make it a movie night.</b>Create your first room to get started.</div>';return}renderRoom(room())}
function selectRoom(v){selected=v;db.active=v;persistLocal();render()}
function renderRoom(r){
 const people=livePeople(r), settled=people.filter(p=>status(r,p)==='Paid').length, remain=people.reduce((a,p)=>a+Math.max(0,owed(r,p.id)-received(r,p.id)),0);
 const main=document.getElementById('main');
 const attendeeRows=people.map(p=>{let paid=received(r,p.id),pending=sent(r,p.id),balance=Math.max(0,owed(r,p.id)-paid),st=status(r,p);return `<div class="person"><div><div class="person-name">${esc(p.name)}</div><div class="person-detail">Owes ${money(owed(r,p.id))} · Paid ${money(paid)}${pending?` · ${money(pending)} marked sent`:''}</div><span class="status ${st==='Paid'?'paid':st==='Unpaid'?'unpaid':'partial'}">${st}</span></div><div class="toolbar"><div class="amount">${money(balance)}<small>remaining</small></div><button class="icon-btn" onclick="editPerson('${p.id}')" aria-label="Edit attendee">✎</button><button class="icon-btn" onclick="dropPerson('${p.id}')" aria-label="Remove attendee">×</button></div></div>`}).join('');
 const bookers=r.bookers.map(b=>`<div class="booker-row"><div><div class="booker-name">${esc(b.name)}</div><div class="booker-detail">${b.tickets} tickets booked</div></div><div class="amount">${money(b.paid)}<small>paid for tickets</small></div></div>`).join('');
 const ledger=r.payments.slice().reverse().map(t=>{let p=r.people.find(x=>x.id===t.person);return `<div class="ledger-item"><div><b>${esc(p?.name||'Removed attendee')}</b> · ${money(Math.abs(t.amount))}${t.amount<0?' · refund':''}<div class="person-detail">${esc(t.method)}${t.note?' · '+esc(t.note):''} · ${t.state==='sent'?'Marked sent':'Confirmed by booker'}</div></div><div class="ledger-actions">${t.state==='sent'?`<button class="button secondary small" onclick="markReceived('${t.id}')">Confirm received</button>`:''}<button class="icon-btn" onclick="editPayment('${t.id}')" aria-label="Edit payment">✎</button><button class="icon-btn" onclick="removePayment('${t.id}')" aria-label="Undo payment">↶</button></div></div>`}).join('');
 const allocations=total(r),booked=r.bookers.reduce((a,b)=>a+b.paid,0);
 main.innerHTML=`<section class="panel room-head"><div><div class="eyebrow">${r.shared?'Shared movie room':'This device only'} · ${esc(r.code||'Not shared yet')}</div><h2 class="film-title">${esc(r.movie)}</h2><div class="film-meta">${dateText(r.date)}${r.time?' · '+esc(r.time):''} · ${esc(r.cinema||'Cinema to be decided')}</div>${r.notes?`<div class="notes">${esc(r.notes)}</div>`:''}</div><div class="actions"><button class="button ghost small" onclick="shareRoom()">↗ Share</button><button class="button secondary small" onclick="editOuting()">Edit details</button>${!r.shared||r.ownerToken?'<button class="button ghost small" onclick="deleteRoom()">Delete room</button>':''}<button class="button primary small" onclick="addPerson()">＋ Attendees</button></div></section>
 <div class="stats"><div class="panel stat"><div class="stat-label">Shared ticket total</div><div class="stat-value">${money(allocations)}</div><div class="stat-foot">${people.length} people · ${people.length?money(Math.floor(allocations/people.length))+' each':'Add attendees to split equally'}</div></div><div class="panel stat"><div class="stat-label">Still to receive</div><div class="stat-value">${money(remain)}</div><div class="stat-foot">Confirmed payments only</div></div><div class="panel stat"><div class="stat-label">Settled up</div><div class="stat-value">${settled} / ${people.length}</div></div></div>
 <div class="content-grid"><section class="panel card"><div class="card-head"><div class="card-title">Attendee balances</div><button class="button ghost small" onclick="addPerson()">${people.length?'Edit list':'＋ Add names'}</button></div>${attendeeRows||'<div class="empty">Add attendees to start splitting the cost.</div>'}<div class="hint">The total paid by bookers is split equally across active attendees, down to the paise. Any leftover paise goes to the first names in the list. Adding or removing someone recalculates everyone’s share; their payment history stays attached to them.</div></section><section><div class="panel card"><div class="card-head"><div class="card-title">Booked & paid</div><button class="button ghost small" onclick="addBooker()">＋ Booker</button></div>${bookers||'<div class="empty">Add a booker and ticket total.</div>'}<div class="hint">Ticket + fee total <b>${money(allocations)}</b> · Bookers paid <b>${money(booked)}</b>${allocations===booked?'<br>✓ Totals match.':'<br>⚠ Totals differ. Adjust allocations or booker totals to reconcile.'}</div></div><div class="panel card ledger"><div class="card-head"><div class="card-title">Payment activity</div><button class="button primary small" onclick="addPayment()">＋ Record</button></div>${ledger||'<div class="empty">No payments recorded yet.</div>'}</div><div class="panel card" style="margin-top:16px"><div class="card-head"><div class="card-title">Room details</div><button class="button ghost small" onclick="editInstructions()">${r.instructions?'Edit':'Add'}</button></div><div class="person-detail">Instructions are visible to anyone who opens this room on this device.</div>${r.instructions?`<div class="hint"><b>${esc(r.instructions)}</b><br>Only share details you’re comfortable showing to friends.</div>`:'<div class="person-detail" style="margin-top:10px">Never add a PIN, OTP, password, or card details.</div>'}<div class="room-code">Invite code <b>${esc(r.code||'Not shared yet')}</b><br>${r.shared?'Anyone with this invite can view and edit the room. No account is needed.':'Share this room to create an invite that works across devices.'}</div></div></section></div>
 <div class="notice">Payment tracking only. This app does not send, receive, or verify money. “Sent” is attendee reported; “received” is confirmed by the booker. Data stays in this browser and is not backed up.</div><div class="panel card" style="margin-top:15px"><div class="card-head"><div class="card-title">Who should receive what?</div><button class="button ghost small" onclick="copySummary()">Copy summary</button></div>${r.bookers.map(b=>`<div class="booker-row"><div><div class="booker-name">${esc(b.name)} should receive</div><div class="booker-detail">Share split in proportion to what each booker paid</div></div><div class="amount">${money(collectable(r,b.id))}<small>remaining collection share</small></div></div>`).join('')||'<div class="person-detail">Add a booker to see the collection summary.</div>'}</div>`;
 if(r.syncConflict)main.insertAdjacentHTML('beforeend','<div class="notice">A newer version is available. Your local edit was not synced. <button class="button secondary small" onclick="reloadSharedRoom()">Load latest</button></div>');
}
function openForm(title,body,submit,submitText='Save'){document.getElementById('modal').innerHTML=`<h2>${title}</h2>${body}<div class="modal-actions"><button class="button ghost" onclick="closeModal()">Cancel</button><button class="button primary" id="modalSubmit">${submitText}</button></div>`;document.getElementById('modalBack').classList.add('open');document.getElementById('modalSubmit').onclick=submit}function closeModal(){document.getElementById('modalBack').classList.remove('open')}function val(id){return document.getElementById(id)?.value.trim()||''}function newOuting(){openForm('Create a movie room',`<div class="field"><label>Movie name *</label><input id="movie" required placeholder="What are you watching?"></div><div class="form-row"><div class="field"><label>Date</label><input type="date" id="date"></div><div class="field"><label>Show time</label><input id="time" placeholder="7:30 PM"></div></div><div class="field"><label>Cinema</label><input id="cinema" placeholder="Cinema and city"></div><div class="field"><label>Notes</label><textarea id="notes" placeholder="Meet-up details, seat info..."></textarea></div>`,async()=>{if(!val('movie'))return toast('Add a movie name first');let r={id:id(),movie:val('movie'),date:val('date'),time:val('time'),cinema:val('cinema'),notes:val('notes'),people:[],bookers:[],allocations:{},adjustments:[],payments:[],instructions:'',owner:'Organizer'};db.rooms.unshift(r);selected=r.id;persistLocal();closeModal();render();try{await createSharedRoom(r);toast('Shared movie room created')}catch(e){toast('Room saved here; sharing is unavailable until the site is deployed with its database.')}render()})}function editOuting(){let r=room();openForm('Edit room details',`<div class="field"><label>Movie name *</label><input id="movie" value="${esc(r.movie)}"></div><div class="form-row"><div class="field"><label>Date</label><input type="date" id="date" value="${r.date}"></div><div class="field"><label>Show time</label><input id="time" value="${esc(r.time)}"></div></div><div class="field"><label>Cinema</label><input id="cinema" value="${esc(r.cinema)}"></div><div class="field"><label>Notes</label><textarea id="notes">${esc(r.notes)}</textarea></div>`,()=>{if(!val('movie'))return toast('Movie name is required');Object.assign(r,{movie:val('movie'),date:val('date'),time:val('time'),cinema:val('cinema'),notes:val('notes')});save();closeModal();render()})}function addPerson(){attendeeForm()}
let attendeeDraft=[],attendeeDraftCount=0;
function writeAttendeeFields(){const box=document.getElementById('attendeeFields');if(!box)return;for(let i=0;i<attendeeDraftCount;i++){const input=document.getElementById('attendeeName'+i);if(input)attendeeDraft[i]=input.value}const n=attendeeDraftCount;box.innerHTML=Array.from({length:n},(_,i)=>'<div class="field"><label>Person '+(i+1)+' name *</label><input id="attendeeName'+i+'" value="'+esc(attendeeDraft[i]||'')+'" placeholder="Friend’s name"></div>').join('')}
function resizeAttendeeFields(){for(let i=0;i<attendeeDraftCount;i++){const input=document.getElementById('attendeeName'+i);if(input)attendeeDraft[i]=input.value}const count=Number(val('headcount'));if(!Number.isInteger(count)||count<1||count>20){toast('Choose between 1 and 20 people');return}attendeeDraftCount=count;writeAttendeeFields()}
function attendeeForm(){const r=room();attendeeDraft=livePeople(r).map(p=>p.name);attendeeDraftCount=attendeeDraft.length||1;const n=attendeeDraftCount;const body='<div class="field"><label>How many people are going? *</label><input id="headcount" type="number" min="1" max="20" step="1" value="'+n+'" onchange="resizeAttendeeFields()"></div><div id="attendeeFields"></div><div class="hint">The total paid by bookers is split equally across these names. Add each person once; the app handles the per-person amount and paise remainder.</div>';openForm('Who’s going?',body,saveAttendeeList,'Save attendees');writeAttendeeFields()}
function saveAttendeeList(){const r=room(),count=Number(val('headcount'));if(!Number.isInteger(count)||count<1||count>20)return toast('Choose between 1 and 20 people');for(let i=0;i<attendeeDraftCount;i++){const input=document.getElementById('attendeeName'+i);if(input)attendeeDraft[i]=input.value.trim()}if(count!==attendeeDraftCount)return toast('Update the attendee fields to match the headcount');const names=attendeeDraft.slice(0,count).map(x=>(x||'').trim());if(names.some(x=>!x))return toast('Enter a name for every person');if(new Set(names.map(x=>x.toLowerCase())).size!==names.length)return toast('Each attendee name must be unique');const old=livePeople(r),changed=old.length!==names.length||old.some((p,i)=>p.name.toLowerCase()!==names[i].toLowerCase());if(changed&&old.length&&!confirm('Save this attendee list and recalculate everyone’s equal share? Existing payment history stays with the matching person. Removed attendees will be archived.'))return;let remaining=old.slice(),kept=[];for(const name of names){let person=remaining.find(p=>p.name.toLowerCase()===name.toLowerCase());if(person)remaining.splice(remaining.indexOf(person),1);else if(remaining.length){person=remaining.shift();person.name=name}else{person={id:id(),name,active:true};r.people.push(person)}person.active=true;person.name=name;kept.push(person)}remaining.forEach(p=>p.active=false);recalculate(r);save();closeModal();render();toast('Attendees saved; equal shares updated')}
function personForm(pid){
 const r=room(),p=r.people.find(x=>x.id===pid),count=livePeople(r).length+(p?0:1),share=count?Math.floor(bookedTotal(r)/count):0;
 const note=p?'Names only; the equal split stays the same.':count+' people will split '+money(bookedTotal(r))+' equally: about '+money(share)+' each. Adding this name recalculates everyone’s share.';
 const body='<div class="field"><label>Name *</label><input id="name" value="'+esc(p?.name||'')+'" placeholder="Friend’s name"></div><div class="hint">'+note+' Payments already entered stay in the history.</div>';
 openForm(p?'Edit attendee':'Add attendee',body,()=>{
  const name=val('name');if(!name)return toast('Enter a name');
  if(r.people.some(x=>x.active&&x.name.toLowerCase()===name.toLowerCase()&&x.id!==pid))return toast('That person is already in this room');
  if(p){p.name=name}else{r.people.push({id:id(),name,active:true});recalculate(r)}
  save();closeModal();render();toast(p?'Attendee updated':'Equal shares updated')
 })
}
function editPerson(pid){personForm(pid)}
function dropPerson(pid){
 const r=room(),p=r.people.find(x=>x.id===pid),nextCount=Math.max(0,livePeople(r).length-1),newShare=nextCount?Math.floor(bookedTotal(r)/nextCount):0;
 if(!confirm('Remove '+p.name+' from active attendees? The equal split changes from about '+money(splitCents(r))+' to '+money(newShare)+' per person for the remaining '+nextCount+'. Their '+money(received(r,pid))+' received and '+money(sent(r,pid))+' sent payment history will stay in this room.'))return;
 p.active=false;recalculate(r);save();render();toast('Attendee archived; equal shares recalculated')
}
async function deleteRoom(){const r=room();if(!r)return;if(r.shared&&!r.ownerToken)return toast('Only the room creator can delete this shared room.');if(!confirm('Delete “'+r.movie+'” and all of its attendee and payment records? This cannot be undone.'))return;if(r.shared){try{await callRoomApi('delete',{code:r.code,ownerToken:r.ownerToken})}catch(e){toast(e.message);return}}db.rooms=db.rooms.filter(x=>x.id!==r.id);selected=db.rooms[0]?.id||null;db.active=selected;persistLocal();render();toast('Movie room deleted')}
function addBooker(){let r=room();openForm('Add a booker',`<div class="field"><label>Booker name *</label><input id="name" placeholder="Who booked tickets?"></div><div class="form-row"><div class="field"><label>Tickets booked</label><input id="tickets" type="number" min="1" value="1"></div><div class="field"><label>Total paid (₹)</label><input id="paid" type="number" min="0" step="0.01" placeholder="0.00"></div></div><div class="radio-hint">Bookers can split one group’s tickets. Add another booker for a separate booking or partial payment.</div>`,()=>{let name=val('name'),n=Number(val('tickets')),a=Number(val('paid'));if(!name||n<1||!Number.isFinite(a)||a<0)return toast('Check name, ticket count, and amount');r.bookers.push({id:id(),name,tickets:n,paid:Math.round(a*100)});recalculate(r);save();closeModal();render()})}
function addPayment(){let r=room(),people=livePeople(r);if(!people.length)return toast('Add an attendee first');openForm('Record a payment',`<div class="field"><label>Attendee *</label><select id="person">${people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="form-row"><div class="field"><label>Amount (₹) *</label><input id="amount" type="number" min="0.01" step="0.01" placeholder="210.00"></div><div class="field"><label>Method</label><select id="method"><option>UPI</option><option>Cash</option><option>Other</option></select></div></div><div class="field"><label>Entry type</label><select id="kind"><option value="payment">Payment</option><option value="refund">Refund</option></select><div class="radio-hint">A confirmed refund reduces the attendee’s net paid amount.</div></div><div class="field"><label>Payment step</label><select id="state"><option value="sent">Attendee marked sent</option><option value="received">Booker confirms received</option></select><div class="radio-hint">“Sent” does not reduce the balance. Only a booker’s received confirmation counts as paid.</div></div><div class="field"><label>Note (optional)</label><input id="note" placeholder="For example, advance or refund"></div>`,()=>{let a=Number(val('amount')),person=val('person'),refund=val('kind')==='refund';if(!a||a<0)return toast('Enter a valid amount');if(refund&&Math.round(a*100)>Math.max(0,received(r,person)))return toast('Refund cannot exceed confirmed payments');r.payments.push({id:id(),person,amount:Math.round(a*100)*(refund?-1:1),method:val('method'),state:val('kind')==='refund'?'received':val('state'),note:val('note'),created:Date.now()});save();closeModal();render();toast('Payment recorded')})}function editPayment(tid){let r=room(),t=r.payments.find(x=>x.id===tid);openForm('Edit payment',`<div class="field"><label>Attendee</label><select id="person">${r.people.map(p=>`<option value="${p.id}" ${p.id===t.person?'selected':''}>${esc(p.name)}${p.active?'':' (removed)'}</option>`).join('')}</select></div><div class="form-row"><div class="field"><label>Amount (₹)</label><input id="amount" type="number" min="0.01" step="0.01" value="${(Math.abs(t.amount)/100).toFixed(2)}"></div><div class="field"><label>Method</label><select id="method">${['UPI','Cash','Other'].map(x=>`<option ${t.method===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Entry type</label><select id="kind"><option value="payment" ${t.amount>=0?'selected':''}>Payment</option><option value="refund" ${t.amount<0?'selected':''}>Refund</option></select></div><div class="field"><label>Payment step</label><select id="state"><option value="sent" ${t.state==='sent'?'selected':''}>Attendee marked sent</option><option value="received" ${t.state==='received'?'selected':''}>Booker confirms received</option></select></div><div class="field"><label>Note</label><input id="note" value="${esc(t.note)}"></div>`,()=>{let a=Number(val('amount'));if(!a||a<0)return toast('Enter a valid amount');Object.assign(t,{person:val('person'),amount:Math.round(a*100)*(val('kind')==='refund'?-1:1),method:val('method'),state:val('kind')==='refund'?'received':val('state'),note:val('note')});save();closeModal();render();toast('Payment updated')})}function markReceived(tid){let t=room().payments.find(x=>x.id===tid);if(!confirm(`Confirm ${money(t.amount)} from ${room().people.find(p=>p.id===t.person)?.name||'attendee'} was received? This will reduce their remaining balance.`))return;t.state='received';save();render();toast('Marked as received')}function removePayment(tid){let r=room(),t=r.payments.find(x=>x.id===tid);if(!confirm(`Undo this ${money(t.amount)} ${t.state} payment? The payment record will be removed and the attendee balance will change.`))return;r.payments=r.payments.filter(x=>x.id!==tid);save();render();toast('Payment undone')}
function editInstructions(){let r=room();openForm('Payment instructions',`<div class="field"><label>Details visible in this room</label><textarea id="instructions" placeholder="UPI ID, phone number, or QR image link">${esc(r.instructions)}</textarea><div class="radio-hint">Friends who can open this room on this device can see these details. The demo stores text only. Never add a PIN, OTP, bank password, or card details.</div></div>`,()=>{r.instructions=val('instructions');save();closeModal();render()})}async function shareRoom(){const r=room();if(!r.shared){try{await createSharedRoom(r)}catch(e){toast(e.message);return}}const invite=new URL(location.href);invite.searchParams.set('room',r.code);const text=r.movie+' · '+dateText(r.date)+(r.time?' at '+r.time:'')+'\nRoom code: '+r.code+'\nAnyone with this invite link can view and edit the room; no sign-up is required.';if(navigator.share){try{await navigator.share({title:r.movie,text,url:invite.href})}catch{}}else{try{await navigator.clipboard.writeText(invite.href);toast('Invite link copied')}catch{toast('Copy this room code: '+r.code)}}}function copySummary(){let r=room(),s=`${r.movie} — ${dateText(r.date)}${r.time?' · '+r.time:''}\n${r.cinema||''}\nRoom ${r.code}\n\n${livePeople(r).map(p=>`${p.name}: owes ${money(owed(r,p.id))}, confirmed paid ${money(received(r,p.id))}, remaining ${money(Math.max(0,owed(r,p.id)-received(r,p.id)))} (${status(r,p)})`).join('\n')}\n\nStill to receive: ${money(livePeople(r).reduce((a,p)=>a+Math.max(0,owed(r,p.id)-received(r,p.id)),0))}\nWho should receive: ${r.bookers.map(b=>`${b.name} ${money(collectable(r,b.id))}`).join(' · ')||'no bookers listed'}\nPayment instructions: ${r.instructions||'not provided'}\n\nTracked locally only; “sent” payments are not confirmed.`;navigator.clipboard?.writeText(s).then(()=>toast('Balance summary copied')).catch(()=>toast('Could not copy — check browser permissions'))}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',2600)}applyTheme();render();startRoomPolling();openRoomInviteFromUrl();
</script></body></html>
